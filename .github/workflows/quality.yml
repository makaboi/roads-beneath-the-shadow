name: Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check ".[test]"
      - name: Compile game modules
        run: python -m compileall -q roads_beneath_shadow
      - name: Run complete test suite
        env:
          RBS_SAVE_DIR: ${{ runner.temp }}/rbs-test-saves
        run: python -m unittest discover -s tests -v
      - name: Verify installed pixel assets and render the title screen
        env:
          RBS_SAVE_DIR: ${{ runner.temp }}/rbs-smoke-saves
        run: |
          python -m roads_beneath_shadow --check-install
          python -m roads_beneath_shadow --pixel --screenshot "${{ runner.temp }}/pixel-smoke.png"
