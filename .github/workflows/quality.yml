name: Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check ".[test]"
      - name: Compile game modules
        run: python -m compileall -q roads_beneath_shadow
      - name: Run complete test suite
        env:
          RBS_SAVE_DIR: ${{ runner.temp }}/rbs-test-saves
        run: python -m unittest discover -s tests -v
      - name: Verify the installed wheel outside the source checkout
        env:
          RBS_SAVE_DIR: ${{ runner.temp }}/rbs-smoke-saves
        run: python scripts/check_installed_game.py --report "${{ runner.temp }}/installed-game-qa.json"
      - name: Install Linux native display tools
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xvfb openbox xdotool x11-utils
      - name: Check real X11 resize and fullscreen lifecycle
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        timeout-minutes: 3
        run: python scripts/check_native_display.py --output-dir "${{ runner.temp }}/native-display-check" --timeout 90
      - name: Retain native display report and raw logs
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-display-check
          path: ${{ runner.temp }}/native-display-check/
          if-no-files-found: warn
