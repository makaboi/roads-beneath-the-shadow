name: Publish Desktop Downloads

on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: Build and test desktop archives without publishing a release
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/desktop-release.yml
      - scripts/desktop_release.py
      - scripts/prepare_preview_parts.py
      - scripts/third_party.py
      - scripts/runtime_notices.py
      - third_party/**
      - scripts/check_installed_game.py
      - scripts/check_release_version.py
      - scripts/standalone_entry.py
      - Play Standalone.command
      - Play Roads Beneath the Shadow.command
      - README.md
      - CHANGELOG.md
      - assets/**
      - roads_beneath_shadow/**
      - tests/**

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-desktop-release
  cancel-in-progress: false

jobs:
  plan:
    name: Check whether this version needs a release
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.preview_only)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      build: ${{ steps.release.outputs.build }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Inspect the version and existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/desktop_release.py plan${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview_only)) && ' --preview-only' || '' }}

  build:
    name: Build ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: Linux-x64
          - runner: windows-latest
            platform: Windows-x64
          - runner: macos-latest
            platform: macOS-Apple-Silicon
          - runner: macos-15-intel
            platform: macOS-Intel
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the game, tests, and packager
        run: python -m pip install --disable-pip-version-check ".[test]" pygame-ce==2.5.8 pyinstaller==6.22.0
      - name: Verify the release candidate
        env:
          RBS_SAVE_DIR: ${{ runner.temp }}/rbs-desktop-tests
        run: |
          python -m compileall -q roads_beneath_shadow
          python -m unittest discover -s tests -v
          python scripts/check_release_version.py
      - name: Verify the installed wheel outside the source checkout
        run: python scripts/check_installed_game.py --expected-version "${{ needs.plan.outputs.version }}"
      - name: Freeze the desktop game and its assets
        run: >-
          python -m PyInstaller
          --clean
          --noconfirm
          --onedir
          --name Roads-Beneath-the-Shadow
          --collect-data roads_beneath_shadow
          scripts/standalone_entry.py
      - name: Smoke-test and package the standalone download
        run: >-
          python scripts/desktop_release.py package
          --platform "${{ matrix.platform }}"
          --version "${{ needs.plan.outputs.version }}"
          --output-dir release-packages
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: release-packages/*
          if-no-files-found: error
      - name: Retain bounded archive parts for independent preview review
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview_only)
        run: >-
          python scripts/prepare_preview_parts.py
          --input-dir release-packages
          --output-dir preview-inspection-parts
          --platform "${{ matrix.platform }}"
          --expected-version "${{ needs.plan.outputs.version }}"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview_only)
        with:
          name: review-desktop-${{ matrix.platform }}-part-1
          path: preview-inspection-parts/part-001/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview_only)
        with:
          name: review-desktop-${{ matrix.platform }}-part-2
          path: preview-inspection-parts/part-002/*
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview_only)
        with:
          name: review-desktop-${{ matrix.platform }}-part-3
          path: preview-inspection-parts/part-003/*
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.preview_only)
        with:
          name: review-desktop-${{ matrix.platform }}-part-4
          path: preview-inspection-parts/part-004/*
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish all verified downloads together
    needs: [plan, build]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.preview_only)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-packages
      - name: Create the tagged release and attach every download
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/desktop_release.py publish
          --version "${{ needs.plan.outputs.version }}"
          --output-dir release-packages
