name: Verify macOS Standalone Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.package_name }}
    runs-on: ${{ matrix.runner }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            package_name: Apple-Silicon
          - runner: macos-15-intel
            package_name: Intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check ".[test]"
      - name: Verify the release candidate
        env:
          RBS_SAVE_DIR: ${{ runner.temp }}/rbs-package-saves
        run: |
          python -m compileall -q roads_beneath_shadow
          python -m unittest discover -s tests -v
          python scripts/check_release_version.py
      - name: Verify the installed wheel outside the source checkout
        run: python scripts/check_installed_game.py
      - name: Install packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.0
      - name: Build standalone pixel game
        run: >-
          python -m PyInstaller
          --clean
          --onefile
          --name Roads-Beneath-the-Shadow
          --collect-data roads_beneath_shadow
          scripts/standalone_entry.py
      - name: Smoke-test and assemble the extracted player download
        run: |
          RBS_RELEASE_VERSION=$(python -c 'from scripts.desktop_release import project_version; print(project_version())')
          python scripts/desktop_release.py package --platform "macOS-${{ matrix.package_name }}" --version "$RBS_RELEASE_VERSION" --output-dir release-packages
      - uses: actions/upload-artifact@v4
        with:
          name: Roads-Beneath-the-Shadow-macOS-${{ matrix.package_name }}
          path: release-packages/*
          if-no-files-found: error
