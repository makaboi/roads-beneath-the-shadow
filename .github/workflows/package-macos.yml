name: Package macOS Standalone Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.package_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            package_name: Apple-Silicon
          - runner: macos-15-intel
            package_name: Intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check ".[test]"
      - name: Verify the release candidate
        run: |
          python -m compileall -q roads_beneath_shadow
          python -m unittest discover -s tests -v
          python scripts/check_release_version.py
      - name: Install packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.0
      - name: Build standalone terminal executable
        run: >-
          python -m PyInstaller
          --clean
          --onefile
          --name Roads-Beneath-the-Shadow
          --collect-data roads_beneath_shadow
          scripts/standalone_entry.py
      - name: Smoke-test the frozen game and bundled data
        run: |
          ./dist/Roads-Beneath-the-Shadow --check-install
          printf "6\n" | RBS_SAVE_DIR="${RUNNER_TEMP}/rbs-smoke-saves" ./dist/Roads-Beneath-the-Shadow --fast --no-color
      - name: Assemble player download
        run: |
          mkdir Roads-Beneath-the-Shadow
          cp dist/Roads-Beneath-the-Shadow Roads-Beneath-the-Shadow/
          cp "Play Standalone.command" "Roads-Beneath-the-Shadow/Play Roads Beneath the Shadow.command"
          cp README.md Roads-Beneath-the-Shadow/
          cp CHANGELOG.md Roads-Beneath-the-Shadow/
          chmod +x Roads-Beneath-the-Shadow/Roads-Beneath-the-Shadow
          chmod +x "Roads-Beneath-the-Shadow/Play Roads Beneath the Shadow.command"
          ditto -c -k --norsrc --noextattr --noqtn --noacl --keepParent Roads-Beneath-the-Shadow Roads-Beneath-the-Shadow-macOS-${{ matrix.package_name }}.zip
          shasum -a 256 Roads-Beneath-the-Shadow-macOS-${{ matrix.package_name }}.zip > Roads-Beneath-the-Shadow-macOS-${{ matrix.package_name }}.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Roads-Beneath-the-Shadow-macOS-${{ matrix.package_name }}
          path: |
            Roads-Beneath-the-Shadow-macOS-${{ matrix.package_name }}.zip
            Roads-Beneath-the-Shadow-macOS-${{ matrix.package_name }}.zip.sha256
      - name: Create the tagged release if needed
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release view "${GITHUB_REF_NAME}"
          || gh release create "${GITHUB_REF_NAME}"
          --title "Roads Beneath the Shadow ${GITHUB_REF_NAME}"
          --generate-notes
          || gh release view "${GITHUB_REF_NAME}"
      - name: Attach the verified package
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          Roads-Beneath-the-Shadow-macOS-${{ matrix.package_name }}.zip
          Roads-Beneath-the-Shadow-macOS-${{ matrix.package_name }}.zip.sha256
          --clobber
