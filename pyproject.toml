[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roads-beneath-the-shadow"
version = "0.4.0"
description = "A pixel-art, choice-driven dark fantasy RPG set in Middle-earth."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All rights reserved" }
authors = [{ name = "makaboi" }]
dependencies = ["pygame-ce>=2.5,<3"]

[project.optional-dependencies]
test = ["Pillow==12.3.0"]

[project.scripts]
roads-beneath-shadow = "roads_beneath_shadow.__main__:main"

[tool.setuptools.packages.find]
include = ["roads_beneath_shadow*"]

[tool.setuptools.package-data]
roads_beneath_shadow = ["audio_assets/*.wav", "pixel_assets/*.png", "pixel_assets/*.json", "font_assets/*.ttf", "font_assets/*.txt"]

[tool.unittest]
start-directory = "tests"
