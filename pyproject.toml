[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roads-beneath-the-shadow"
version = "0.2.2"
description = "A story-driven terminal RPG set in Middle-earth."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All rights reserved" }
authors = [{ name = "makaboi" }]
dependencies = []

[project.optional-dependencies]
test = ["Pillow==12.3.0"]

[project.scripts]
roads-beneath-shadow = "roads_beneath_shadow.__main__:main"

[tool.setuptools.packages.find]
include = ["roads_beneath_shadow*"]

[tool.setuptools.package-data]
roads_beneath_shadow = ["audio_assets/*.wav"]

[tool.unittest]
start-directory = "tests"
